name: Windows CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ZTranscribe.sln
      - name: Build
        run: dotnet build ZTranscribe.sln --configuration Release --no-restore
      - name: Core checks
        run: dotnet run --project tests/ZTranscribe.Core.Tests --configuration Release --no-build
      - name: Publish Windows x64
        run: dotnet publish src/ZTranscribe.App/ZTranscribe.App.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: z-transcribe-win-x64
          path: artifacts/win-x64

